<!DOCTYPE html>
<html lang="en">
<head>
    <title>World AT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --app-bg: #1a1d23; 
            --yun-orange: #ff6a00; 
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #ff9d5c;
            --alert: #ff3333;
            --success: #00ff88;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: var(--app-bg); 
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
        }

        #camera-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; z-index: -1;
        }

        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #23272f 0%, #1a1d23 100%); 
            z-index: 3000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            transition: opacity 0.8s ease, visibility 0.8s; 
        }

        .radar-container {
            position: relative; width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 30px;
        }

        .radar-sweep { 
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from -90deg at 50% 50%, transparent 270deg, rgba(255, 106, 0, 0.4) 360deg); 
            animation: sweep 3s linear infinite; 
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .commence-btn { 
            background: transparent; color: white; border: 1px solid var(--yun-orange); 
            padding: 12px 30px; border-radius: 4px; cursor: pointer; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            z-index: 3001;
        }

        .app-overlay { 
            position: absolute; top: env(safe-area-inset-top, 15px); 
            left: 50%; transform: translateX(-50%); 
            width: 94%; max-width: 500px; z-index: 100; 
        }

        .control-panel { 
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); padding: 10px 12px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }

        .telemetry-panel {
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); padding: 8px 12px; border-radius: 8px; 
            margin-top: 10px; display: flex; justify-content: space-between;
            font-size: 11px; font-family: monospace; color: var(--accent);
            text-transform: uppercase; letter-spacing: 1px;
        }

        .asset-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .panel-label { font-size: 8px; color: var(--accent); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 2px; }

        select { 
            background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--glass-border); border-radius: 4px;
            font-weight: bold; font-size: 13px; outline: none; cursor: pointer; width: 100%; padding: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 1; pointer-events: auto;
        }
        
        .button-group { display: flex; gap: 6px; flex-shrink: 0; }
        .ui-btn { background: var(--glass-border); color: white; border: 1px solid transparent; padding: 8px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 10px; text-transform: uppercase; transition: 0.2s; white-space: nowrap; }
        .ui-btn.active { background: var(--yun-orange); border-color: white; }
        .ui-btn.primary { background: var(--yun-orange); }

        .ar-container { position: absolute; bottom: env(safe-area-inset-bottom, 25px); left: 50%; transform: translateX(-50%); z-index: 150; }
        
        .ar-btn {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            color: white; padding: 12px 24px; border-radius: 25px; font-size: 11px;
            text-transform: uppercase; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; opacity: 1; pointer-events: auto;
        }

        .ar-btn.ready {
            background: var(--success); border-color: white; color: black;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .details-panel { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100%; 
            background: rgba(18, 20, 24, 0.98); backdrop-filter: blur(30px);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; border-left: 1px solid var(--glass-border);
        }
        .details-panel.active { right: 0; }
        .spec-content { padding: 60px 30px; }
        .spec-item { margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        model-viewer { width: 100vw; height: 100vh; background: transparent; }
        .Hotspot { background: var(--yun-orange); border-radius: 50%; width: 14px; height: 14px; border: 2px solid white; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(255,106,0,0.5); }
        .Hotspot.hidden { opacity: 0; transform: scale(0); pointer-events: none; }
        .HotspotAnnotation { background: rgba(0, 0, 0, 0.85); color: white; padding: 5px 10px; border-radius: 4px; font-size: 10px; position: absolute; transform: translate(15px, -50%); border: 1px solid var(--yun-orange); white-space: nowrap; pointer-events: none; }
    </style>
</head>
<body>

<video id="camera-bg" autoplay playsinline muted></video>

<div id="start-screen">
    <div class="radar-container">
        <div class="radar-sweep"></div>
        <div style="z-index: 3002; background:var(--yun-orange); color:white; padding:6px 14px; font-weight:900; font-style:italic; border-radius:4px; font-size: 14px;">World AR</div>
    </div>
    <button class="commence-btn" onclick="initializeSystems()">Acquire Telemetry</button>
</div>

<div class="app-overlay">
    <div class="control-panel">
        <div class="asset-info">
            <div class="panel-label">Active Asset</div>
            <select id="model-select"></select>
        </div>
        <div class="button-group">
            <button id="toggle-hotspots" class="ui-btn active">Hotspots</button>
            <button onclick="document.getElementById('details-panel').classList.add('active')" class="ui-btn primary">Specs</button>
        </div>
    </div>
    <div class="telemetry-panel">
        <span id="data-dist">DIST: N/A</span>
        <span id="data-head">HDG: N/A</span>
        <span id="data-status" style="color: var(--alert);">SEARCHING</span>
    </div>
</div>

<div class="ar-container">
    <button id="ar-button" class="ar-btn">DEPLOY AR (MANUAL)</button>
</div>

<div id="details-panel" class="details-panel">
    <div class="spec-content">
        <h2 id="asset-title" style="color: var(--yun-orange); font-weight: 300; text-transform: uppercase; margin-bottom:30px; font-size: 1.5rem;">-</h2>
        <div class="spec-item"><span class="panel-label">Operated By</span><span id="spec-crew" style="display:block; margin-top:4px; font-size: 14px;">-</span></div>
        <div class="spec-item"><span class="panel-label">Primary Zone</span><span id="spec-base" style="display:block; margin-top:4px; font-size: 14px;">-</span></div>
        <div class="spec-item"><span class="panel-label">Coordinates</span><span id="spec-coords" style="display:block; margin-top:4px; font-size: 14px; font-family: monospace;">-</span></div>
        <div class="spec-item"><span class="panel-label">Description</span><p id="spec-desc" style="font-size:13px; opacity:0.8; line-height:1.5; margin-top:8px;"></p></div>
        <button onclick="document.getElementById('details-panel').classList.remove('active')" style="width:100%; background:var(--yun-orange); color:white; border:none; padding:14px; border-radius:8px; cursor:pointer; font-weight:bold; text-transform:uppercase; margin-top: 20px;">Dismiss</button>
    </div>
</div>

<model-viewer id="main-viewer" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1" tone-mapping="neutral" interaction-prompt="none">
    <div slot="ar-button" style="display:none;"></div>
</model-viewer>

<script>
    const viewer = document.querySelector('#main-viewer');
    const select = document.querySelector('#model-select');
    const hotspotBtn = document.querySelector('#toggle-hotspots');
    const arBtn = document.querySelector('#ar-button');
    const DEPLOYMENT_RADIUS_METERS = 15;
    
    let manualOverride = false;
    let locationsInitialized = false;

    const fleetData = [
        {
            "name": "Aircraft Loader TLD",
            "file": "tld_121_aircraft_loader",
            "crew": "Ground Ops Team A",
            "base": "Zone 1",
            "description": "High-capacity aircraft loader used for main deck cargo operations.",
            "lat": 0, 
            "lng": 0
        },
        {
            "name": "Ground Power Unit",
            "file": "gpu_aiport_ground_power_unit",
            "crew": "Maintenance Team 4",
            "base": "Zone 2",
            "description": "Mobile power unit providing 400Hz AC power to aircraft on the stand.",
            "lat": 0, 
            "lng": 0
        }
    ];

    const hotspotMap = {
        "tld_121_aircraft_loader": [
            { pos: "-0.00289m 0.6796m 0.2817m", norm: "0m 1m 0m", label: "Main Loading Deck" },
            { pos: "0.2443m 0.7675m -0.3819m", norm: "-0.34m 0.18m 0.91m", label: "Controls" }
        ],
        "gpu_aiport_ground_power_unit": [
            { pos: "-1.28407m 0.7819m 0.0546m", norm: "-1m 0m 0m", label: "Control Panel" },
            { pos: "1.1345m 1.1426m -0.6715m", norm: "0m 0m 1m", label: "Power Cable" }
        ]
    };

    function initializeSystems() {
        requestPermissions();
        initCameraBackground();
        
        const screen = document.getElementById('start-screen');
        screen.style.opacity = '0';
        screen.style.pointerEvents = 'none';
        setTimeout(() => screen.style.display = 'none', 800);
        
        initSelect();
    }

    function initCameraBackground() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    const videoElement = document.getElementById('camera-bg');
                    videoElement.srcObject = stream;
                })
                .catch(err => console.error("Camera stream access denied", err));
        }
    }

    function initSelect() {
        select.innerHTML = fleetData.map((m, i) => `<option value="${i}">${m.name.toUpperCase()}</option>`).join('');
        updateAsset(0);
        
        select.addEventListener('change', (e) => {
            manualOverride = true;
            updateAsset(e.target.value);
        });
    }

    function requestPermissions() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(handlePositionUpdate, handleGeoError, { 
                enableHighAccuracy: true, 
                maximumAge: 0 
            });
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(permissionState => {
                if (permissionState === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientationUpdate);
                }
            }).catch(console.error);
        } else {
            window.addEventListener('deviceorientation', handleOrientationUpdate, true);
        }
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function handlePositionUpdate(position) {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        if (!locationsInitialized) {
            fleetData[0].lat = userLat;
            fleetData[0].lng = userLng;
            fleetData[1].lat = userLat + 0.00005;
            fleetData[1].lng = userLng + 0.00005;
            locationsInitialized = true;
            updateAsset(select.value); 
        }
        
        let nearestDistance = Infinity;
        let nearestIndex = 0;

        fleetData.forEach((asset, index) => {
            const distance = haversineDistance(userLat, userLng, asset.lat, asset.lng);
            if (distance < nearestDistance) {
                nearestDistance = distance;
                nearestIndex = index;
            }
        });

        document.getElementById('data-dist').innerText = `DIST: ${nearestDistance.toFixed(1)}m`;

        if (!manualOverride && parseInt(select.value) !== nearestIndex) {
            select.value = nearestIndex;
            updateAsset(nearestIndex);
        }

        const statusEl = document.getElementById('data-status');
        if (nearestDistance <= DEPLOYMENT_RADIUS_METERS) {
            statusEl.innerText = "IN ZONE";
            statusEl.style.color = "var(--success)";
            arBtn.classList.add('ready');
            arBtn.innerText = "DEPLOY AR (AUTO)";
        } else {
            statusEl.innerText = "APPROACHING";
            statusEl.style.color = "var(--alert)";
            arBtn.classList.remove('ready');
            arBtn.innerText = "DEPLOY AR (MANUAL)";
        }
    }

    function handleGeoError(error) {
        document.getElementById('data-dist').innerText = "GPS ERROR";
        document.getElementById('data-status').innerText = "OFFLINE";
    }

    function handleOrientationUpdate(event) {
        let heading = event.webkitCompassHeading || Math.abs(event.alpha - 360);
        if (heading) {
            document.getElementById('data-head').innerText = `HDG: ${Math.round(heading)}°`;
            
            const currentOrbit = viewer.getCameraOrbit();
            viewer.cameraOrbit = `${heading}deg ${currentOrbit.phi}rad ${currentOrbit.radius}m`;
        }
    }

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        
        document.getElementById('asset-title').innerText = asset.name;
        document.getElementById('spec-crew').innerText = asset.crew;
        document.getElementById('spec-base').innerText = asset.base;
        document.getElementById('spec-coords').innerText = `${asset.lat.toFixed(5)}, ${asset.lng.toFixed(5)}`;
        document.getElementById('spec-desc').innerText = asset.description;

        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());

        viewer.addEventListener('load', () => {
            const points = hotspotMap[asset.file];
            if (points) {
                points.forEach((p, i) => {
                    const b = document.createElement('button');
                    b.className = `Hotspot ${hotspotBtn.classList.contains('active') ? '' : 'hidden'}`;
                    b.slot = `hotspot-${i}`;
                    b.setAttribute('data-position', p.pos);
                    b.setAttribute('data-normal', p.norm);
                    b.innerHTML = `<div class="HotspotAnnotation">${p.label}</div>`;
                    b.onclick = () => {
                        viewer.cameraTarget = p.pos;
                        viewer.cameraOrbit = "45deg 75deg 4m";
                    };
                    viewer.appendChild(b);
                });
            }
        }, { once: true });
    }

    hotspotBtn.onclick = () => {
        const isActive = hotspotBtn.classList.toggle('active');
        viewer.querySelectorAll('.Hotspot').forEach(h => {
            isActive ? h.classList.remove('hidden') : h.classList.add('hidden');
        });
    };

    arBtn.onclick = () => {
        viewer.activateAR();
    };
</script>

</body>
</html>
