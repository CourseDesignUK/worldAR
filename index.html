<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR GPS Viewer</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js'></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js'></script>
    <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            z-index: 40;
            pointer-events: none;
        }

        #hud-container {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Authorization Gate -->
    <div id="auth-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-zinc-900 px-4 text-center">
        <h1 class="text-2xl text-white font-semibold mb-4">AR Sensor Access</h1>
        <p class="text-zinc-400 mb-8 max-w-sm">Camera, GPS, and device orientation permissions are required to place 3D models in the physical environment.</p>
        <button id="btn-authorize" class="pointer-events-auto px-6 py-3 bg-white text-black font-medium rounded-lg hover:bg-zinc-200 transition-colors">
            Enable Sensors
        </button>
    </div>

    <!-- HUD Overlay -->
    <div id="hud-container">
        <div class="center-dot"></div>

        <!-- Top Left: Telemetry -->
        <div class="absolute top-4 left-4 glass-panel p-3 rounded-lg text-xs sm:text-sm">
            <div class="mb-1 text-zinc-400 text-[10px] uppercase tracking-wider">Position</div>
            <div class="font-mono">LAT: <span id="hud-lat">--</span></div>
            <div class="font-mono">LON: <span id="hud-lon">--</span></div>
            <div class="font-mono mt-1 text-zinc-300">ACC: <span id="hud-acc">--</span> m</div>
        </div>

        <!-- Top Right: Orientation -->
        <div class="absolute top-4 right-4 glass-panel p-3 rounded-lg text-xs sm:text-sm text-right">
            <div class="mb-1 text-zinc-400 text-[10px] uppercase tracking-wider">Heading</div>
            <div class="font-mono"><span id="hud-heading">--</span>°</div>
        </div>

        <!-- Bottom Center: Target Data -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 glass-panel px-4 py-2 rounded-full text-sm flex gap-4">
            <div>Model: <span class="font-semibold text-white">Active</span></div>
            <div class="w-px bg-white/20"></div>
            <div>Distance: <span id="hud-distance" class="font-mono font-semibold">-- m</span></div>
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
        renderer="antialias: true; alpha: true; colorManagement: true;"
        id="ar-scene">
        
        <a-assets>
            <!-- Define the 3D model source here. Replace model.glb with your exact filename -->
            <a-asset-item id="custom-model" src="unroot/models/model.glb"></a-asset-item>
        </a-assets>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        const authScreen = document.getElementById('auth-screen');
        const btnAuthorize = document.getElementById('btn-authorize');
        const hudContainer = document.getElementById('hud-container');
        const arScene = document.getElementById('ar-scene');

        const hudLat = document.getElementById('hud-lat');
        const hudLon = document.getElementById('hud-lon');
        const hudAcc = document.getElementById('hud-acc');
        const hudHeading = document.getElementById('hud-heading');
        const hudDistance = document.getElementById('hud-distance');

        let targetEntityPlaced = false;
        let initialPosition = null;

        btnAuthorize.addEventListener('click', async () => {
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        startSystem();
                    } else {
                        alert("Orientation permission denied. AR execution halted.");
                    }
                } else {
                    startSystem();
                }
            } catch (error) {
                console.error("Permission request failed:", error);
                startSystem();
            }
        });

        function startSystem() {
            authScreen.style.display = 'none';
            hudContainer.style.display = 'block';
            initializeSensors();
        }

        function initializeSensors() {
            window.addEventListener('deviceorientation', (event) => {
                let heading = event.webkitCompassHeading || Math.abs(event.alpha - 360);
                if (heading) hudHeading.innerText = heading.toFixed(1);
            });

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => processLocationUpdate(position),
                    (error) => console.error("GPS Error:", error),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            }
        }

        function processLocationUpdate(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = position.coords.accuracy;

            hudLat.innerText = lat.toFixed(6);
            hudLon.innerText = lon.toFixed(6);
            hudAcc.innerText = acc ? acc.toFixed(1) : "--";

            if (!targetEntityPlaced && acc < 50) {
                initialPosition = { lat, lon };
                placeARModel(lat, lon);
                targetEntityPlaced = true;
            }

            if (targetEntityPlaced && initialPosition) {
                const targetLat = initialPosition.lat + 0.0001; 
                const dLat = (targetLat - lat) * 111000;
                const dLon = (initialPosition.lon - lon) * 111000 * Math.cos(lat * Math.PI / 180);
                const distance = Math.sqrt(dLat * dLat + dLon * dLon);
                hudDistance.innerText = distance.toFixed(1);
            }
        }

        function placeARModel(userLat, userLon) {
            // Places model approximately 11 meters North of initial GPS fix
            const targetLat = userLat + 0.0001;
            const targetLon = userLon;

            const scene = document.querySelector('a-scene');
            
            const modelContainer = document.createElement('a-entity');
            modelContainer.setAttribute('gps-entity-place', `latitude: ${targetLat}; longitude: ${targetLon};`);
            
            // Adjust scale based on native model dimensions. Default is 1:1.
            modelContainer.setAttribute('gltf-model', '#custom-model');
            modelContainer.setAttribute('scale', '1 1 1');
            modelContainer.setAttribute('position', '0 0 0');

            scene.appendChild(modelContainer);
        }
    </script>
</body>
</html>
